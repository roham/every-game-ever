name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dataset release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' --repo ${{ github.repository }})
          gh release download "$TAG" --pattern '*.tar.gz' --dir /tmp/ege-data --repo ${{ github.repository }}
          mkdir -p data/current && tar -xzf /tmp/ege-data/every-game-ever-*.tar.gz -C data/current
          echo "dataset from $TAG" >> $GITHUB_STEP_SUMMARY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build atlas + site
        run: |
          cd web
          npm ci --no-audit --no-fund
          node scripts/build-atlas.mjs ../data/current
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
